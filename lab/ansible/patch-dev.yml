# Patch the hosts in `dev` from what their environment offers — nothing else.
# Run with --check first; the same playbook, without it, is the change.
- name: Patch dev from its pinned environment
  hosts: dev
  become: true
  gather_facts: false
  tasks:
    - name: The package the environments differ on, before
      ansible.builtin.command: rpm -q lab-hello
      register: before
      changed_when: false
      check_mode: false

    - name: Apply what the pinned environment offers — the lab repositories only, with fresh metadata
      ansible.builtin.dnf:
        name: "*"
        state: latest
        disablerepo: "*"
        enablerepo: "lab-*"
        update_cache: true      # phase 2, finding A: a warm cache hides a promotion
      register: patch

    - name: The same package, after
      ansible.builtin.command: rpm -q lab-hello
      register: after
      changed_when: false
      check_mode: false

    - name: Does the change need a reboot to be live
      ansible.builtin.command: needs-restarting -r
      register: reboot
      changed_when: false
      failed_when: reboot.rc not in [0, 1]
      check_mode: false

    - name: Report
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ before.stdout }} → {{ after.stdout }} · reboot {{ 'needed' if reboot.rc == 1 else 'not needed' }}"
